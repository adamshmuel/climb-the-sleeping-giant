<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sneak the Nest HUD</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: rgba(43, 35, 80, 0.85);
    --outline: #15102B;
    --text: #FFFFFF;
    --coin: #FFC93C;
    --shop: #3DD6C4;
    --calm: #5EE07A;
    --warn: #FFC93C;
    --wake: #FF4D5E;
    --rare: #4DB8FF;
    --epic: #B36BFF;
    --u: min(1vw, 1.78vh);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #8A8FE0 url("hud-bg.png") center / cover no-repeat;
    font-family: "Fredoka", "Fredoka One", sans-serif;
    color: var(--text);
    position: relative;
  }
  .stroke { -webkit-text-stroke: calc(var(--u) * 0.18) var(--outline); paint-order: stroke fill; }
  .panel {
    background: var(--panel);
    border: calc(var(--u) * 0.3) solid var(--outline);
    border-radius: calc(var(--u) * 1.4);
  }

  /* Roblox's own top-left buttons (menu, chat): kept clear */
  .core { position: absolute; top: calc(var(--u) * 1); left: calc(var(--u) * 1); display: flex; gap: calc(var(--u) * 0.8); }
  .core div { width: calc(var(--u) * 4); height: calc(var(--u) * 4); border-radius: calc(var(--u) * 1); background: rgba(0,0,0,0.35); }

  /* Top left: coins, under Roblox's buttons */
  .coins {
    position: absolute; top: calc(var(--u) * 6); left: calc(var(--u) * 1.2);
    display: flex; align-items: center; gap: calc(var(--u) * 0.8);
    padding: calc(var(--u) * 0.5) calc(var(--u) * 1.6) calc(var(--u) * 0.5) calc(var(--u) * 0.6);
    font-size: calc(var(--u) * 3);
  }
  .coin {
    width: calc(var(--u) * 3.6); height: calc(var(--u) * 3.6); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFE89A, var(--coin) 60%, #D99A12);
    border: calc(var(--u) * 0.3) solid var(--outline);
    display: grid; place-items: center; font-size: calc(var(--u) * 2); color: #8A5A00;
  }

  /* Top center: objective + noise meter */
  .top {
    position: absolute; top: calc(var(--u) * 1); left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 0.8);
  }
  .objective {
    display: flex; align-items: center; gap: calc(var(--u) * 0.8);
    padding: calc(var(--u) * 0.5) calc(var(--u) * 1.8) calc(var(--u) * 0.5) calc(var(--u) * 0.8);
    font-size: calc(var(--u) * 2.4);
    border-radius: 999px;
  }
  .objective svg { width: calc(var(--u) * 3.4); height: calc(var(--u) * 3.4); }
  .noise { display: flex; align-items: center; gap: calc(var(--u) * 0.8); }
  .noise .face {
    width: calc(var(--u) * 4.2); height: calc(var(--u) * 4.2); border-radius: 50%;
    background: #C8B5F5; border: calc(var(--u) * 0.3) solid var(--outline);
    display: grid; place-items: center; position: relative;
  }
  .noise .face svg { width: 80%; height: 80%; }
  .bar {
    width: calc(var(--u) * 26); height: calc(var(--u) * 2.6);
    border-radius: 999px; padding: calc(var(--u) * 0.35);
  }
  .fill {
    height: 100%; width: 72%; border-radius: 999px;
    background: linear-gradient(90deg, var(--calm) 0%, var(--calm) 40%, var(--warn) 70%, var(--wake) 100%);
    background-size: calc(var(--u) * 25.3) 100%;
    position: relative;
  }
  .fill::after {
    content: ""; position: absolute; inset: 0 0 50% 0; border-radius: 999px;
    background: rgba(255,255,255,0.35);
  }
  .zzz { font-size: calc(var(--u) * 2.2); }

  /* Left side: carried egg + incubators */
  .left {
    position: absolute; left: calc(var(--u) * 1.2); top: 50%; transform: translateY(-34%);
    display: flex; flex-direction: column; gap: calc(var(--u) * 1);
  }
  .card {
    display: flex; align-items: center; gap: calc(var(--u) * 0.8);
    padding: calc(var(--u) * 0.6) calc(var(--u) * 1.2) calc(var(--u) * 0.6) calc(var(--u) * 0.6);
    font-size: calc(var(--u) * 1.9);
  }
  .card small { display: block; font-family: "Nunito", sans-serif; font-size: calc(var(--u) * 1.3); opacity: 0.85; }
  .egg { width: calc(var(--u) * 3.2); height: calc(var(--u) * 4); }
  .card.carry { border-color: var(--rare); box-shadow: 0 0 calc(var(--u) * 1.6) rgba(77,184,255,0.7); }

  /* Right side: Shop, Index, Pets */
  .right {
    position: absolute; right: calc(var(--u) * 1.2); top: calc(var(--u) * 6);
    display: flex; flex-direction: column; gap: calc(var(--u) * 1);
  }
  .btn {
    width: calc(var(--u) * 7.4); height: calc(var(--u) * 7.4);
    border-radius: calc(var(--u) * 2);
    border: calc(var(--u) * 0.35) solid var(--outline);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--u) * 0.2);
    font-size: calc(var(--u) * 1.7);
    box-shadow: inset 0 calc(var(--u) * 0.6) 0 rgba(255,255,255,0.35), 0 calc(var(--u) * 0.5) 0 var(--outline);
  }
  .btn svg { width: 55%; height: 55%; }
  /* Button words: thick dark outline so white text reads on light buttons (about 2-3 px visible at phone size) */
  .label {
    -webkit-text-stroke: calc(var(--u) * 0.62) var(--outline); paint-order: stroke fill;
    text-shadow: 0 calc(var(--u) * 0.25) 0 var(--outline);
    letter-spacing: 0.02em; line-height: 1;
  }
  .btn { position: relative; }
  .btn.gift { background: linear-gradient(#FFC4D6, #FF9EB8); }
  /* Small dot when a reward is ready */
  .dot {
    position: absolute; top: calc(var(--u) * -0.7); right: calc(var(--u) * -0.7);
    width: calc(var(--u) * 2.2); height: calc(var(--u) * 2.2); border-radius: 50%;
    background: #FF4D5E; border: calc(var(--u) * 0.35) solid var(--outline);
  }
  /* Friend bonus tag under the coins */
  .friend {
    position: absolute; top: calc(var(--u) * 11.4); left: calc(var(--u) * 1.6);
    display: flex; align-items: center; gap: calc(var(--u) * 0.5);
    padding: calc(var(--u) * 0.25) calc(var(--u) * 1) calc(var(--u) * 0.25) calc(var(--u) * 0.4);
    font-size: calc(var(--u) * 1.5); border-radius: 999px;
  }
  .friend svg { width: calc(var(--u) * 2.2); height: calc(var(--u) * 2.2); }
  .btn.shop { background: linear-gradient(#5FE6D6, var(--shop)); }
  .btn.index { background: linear-gradient(#C99BFF, var(--epic)); }
  .btn.pets { background: linear-gradient(#FFB894, #FF8F6B); }

  /* Bottom right: Grab button, above the jump button */
  .grab {
    position: absolute;
    width: calc(var(--u) * 10); height: calc(var(--u) * 10); border-radius: 50%;
    background: radial-gradient(circle at 40% 30%, #FFE58A, var(--coin) 70%);
    border: calc(var(--u) * 0.4) solid var(--outline);
    box-shadow: inset 0 calc(var(--u) * 0.6) 0 rgba(255,255,255,0.4), 0 calc(var(--u) * 0.5) 0 var(--outline);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: calc(var(--u) * 1.9); color: var(--text);
  }
  .grab svg { width: 50%; height: 50%; }
  .key {
    position: absolute; top: calc(var(--u) * -0.6); left: calc(var(--u) * -0.6);
    width: calc(var(--u) * 3); height: calc(var(--u) * 3); border-radius: calc(var(--u) * 0.7);
    background: #fff; color: var(--outline); border: calc(var(--u) * 0.3) solid var(--outline);
    display: grid; place-items: center; font-size: calc(var(--u) * 1.8);
  }

  /* Roblox's own touch controls, drawn faint to show the free corners */
  .touch { display: none; }
  .thumb { position: absolute; left: calc(var(--u) * 4); bottom: calc(var(--u) * 4); width: calc(var(--u) * 15); height: calc(var(--u) * 15); border-radius: 50%; background: rgba(255,255,255,0.18); border: calc(var(--u) * 0.3) solid rgba(255,255,255,0.4); }
  .thumb::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: rgba(255,255,255,0.35); }
  .jump { position: absolute; right: calc(var(--u) * 4); bottom: calc(var(--u) * 4); width: calc(var(--u) * 11); height: calc(var(--u) * 11); border-radius: 50%; background: rgba(255,255,255,0.18); border: calc(var(--u) * 0.3) solid rgba(255,255,255,0.4); }

  /* Desktop: Grab sits bottom right, shows its key */
  .grab { right: calc(var(--u) * 3); bottom: calc(var(--u) * 4); }

  /* Phone: show touch controls, lift Grab above the jump button */
  @media (max-width: 900px) {
    :root { --u: min(1.25vw, 2.2vh); }
    .touch { display: block; }
    .key { display: none; }
    .grab { right: calc(var(--u) * 17); bottom: calc(var(--u) * 5); width: calc(var(--u) * 9); height: calc(var(--u) * 9); }
    .left { top: calc(var(--u) * 14.5); transform: none; gap: calc(var(--u) * 0.8); }
    .card { padding: calc(var(--u) * 0.4) calc(var(--u) * 1) calc(var(--u) * 0.4) calc(var(--u) * 0.5); }
    .card small, .card.extra { display: none; }
    .card small.keep { display: block; }
    .friend { top: calc(var(--u) * 10.6); }
    /* Right side: 2 x 2 grid, so the Pets button ends about one button-height above the jump button */
    .right { top: calc(var(--u) * 6); transform: none; display: grid; grid-template-columns: repeat(2, auto); gap: calc(var(--u) * 1); }
    .btn { width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); font-size: calc(var(--u) * 1.5); }
    /* In the nest on a phone: no objective text, only one thin meter row at the very top, so the giant's eyes stay visible */
    .objective { display: none; }
    .top { top: calc(var(--u) * 0.6); }
    .noise { gap: calc(var(--u) * 0.5); }
    .noise .face { width: calc(var(--u) * 2.8); height: calc(var(--u) * 2.8); border-width: calc(var(--u) * 0.25); }
    .bar { width: calc(var(--u) * 24); height: calc(var(--u) * 1.8); padding: calc(var(--u) * 0.25); }
    .fill { background-size: calc(var(--u) * 23.5) 100%; }
    .zzz { font-size: calc(var(--u) * 1.6); }
  }
</style>
</head>
<body>

  <div class="core"><div></div><div></div></div>

  <div class="coins panel stroke"><div class="coin">$</div>1,250</div>
  <div class="friend panel stroke">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="14" cy="14" r="6" fill="#FFD9B8" stroke="#15102B" stroke-width="2.5"/>
      <circle cx="27" cy="16" r="5" fill="#FFD9B8" stroke="#15102B" stroke-width="2.5"/>
      <path d="M4 34 q2 -11 10 -11 q8 0 10 11 z" fill="#3DD6C4" stroke="#15102B" stroke-width="2.5"/>
      <path d="M20 34 q2 -9 7 -9 q7 0 9 9 z" fill="#FF9EB8" stroke="#15102B" stroke-width="2.5"/>
    </svg>
    Friend bonus +10%
  </div>

  <div class="top">
    <div class="objective panel stroke">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <ellipse cx="22" cy="17" rx="9" ry="12" fill="#4DB8FF" stroke="#15102B" stroke-width="2.5"/>
        <path d="M5 30 q4 -9 12 -6 l8 2 q4 1 3 4 l-9 0 l9 2 q3 1 1 4 l-12 0 q-8 0 -12 -6 z" fill="#FFD9B8" stroke="#15102B" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
      Sneak it home
    </div>
    <div class="noise">
      <div class="face">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="11" cy="9" r="5" fill="#C8B5F5" stroke="#15102B" stroke-width="2"/>
          <circle cx="29" cy="9" r="5" fill="#C8B5F5" stroke="#15102B" stroke-width="2"/>
          <path d="M10 19 q4 3 8 0" fill="none" stroke="#15102B" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M22 18 q4 -4 8 0" fill="none" stroke="#15102B" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="26" cy="19" r="1.8" fill="#15102B"/>
          <circle cx="9" cy="25" r="3" fill="#FF9EB8"/><circle cx="31" cy="25" r="3" fill="#FF9EB8"/>
          <ellipse cx="20" cy="25" rx="3" ry="2" fill="#FF9EB8" stroke="#15102B" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="bar panel"><div class="fill"></div></div>
      <div class="zzz stroke">z<span style="font-size:1.3em">Z</span></div>
    </div>
  </div>

  <div class="left">
    <div class="card carry panel stroke">
      <svg class="egg" viewBox="0 0 32 40" aria-hidden="true">
        <ellipse cx="16" cy="22" rx="13" ry="16" fill="#4DB8FF" stroke="#15102B" stroke-width="2.5"/>
        <path d="M5 20 l5 -4 l5 4 l5 -4 l5 4 l3 -2" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
        <ellipse cx="11" cy="13" rx="3" ry="4" fill="#fff" opacity="0.5"/>
      </svg>
      <div>Rare<small>On your back</small></div>
    </div>
    <div class="card panel stroke">
      <svg class="egg" viewBox="0 0 32 40" aria-hidden="true">
        <!-- incubator: glass dome over an egg on a base -->
        <rect x="3" y="31" width="26" height="7" rx="3" fill="#FFFFFF" stroke="#15102B" stroke-width="2.5"/>
        <ellipse cx="16" cy="23" rx="6" ry="8" fill="#5EE07A" stroke="#15102B" stroke-width="2"/>
        <circle cx="14" cy="22" r="1.6" fill="#fff"/><circle cx="18" cy="26" r="1.6" fill="#fff"/>
        <path d="M4 31 v-11 a12 12 0 0 1 24 0 v11" fill="rgba(215,243,255,0.45)" stroke="#15102B" stroke-width="2.5"/>
        <path d="M9 17 q2 -5 6 -6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div>0:12<small class="keep">Hatch</small></div>
    </div>
    <div class="card extra panel stroke">
      <svg class="egg" viewBox="0 0 32 40" aria-hidden="true">
        <ellipse cx="16" cy="22" rx="13" ry="16" fill="#EEF2F5" stroke="#15102B" stroke-width="2.5"/>
      </svg>
      <div>Ready!<small>Tap to collect</small></div>
    </div>
  </div>

  <div class="right">
    <div class="btn gift">
      <div class="dot"></div>
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect x="7" y="17" width="26" height="17" rx="2" fill="#fff" stroke="#15102B" stroke-width="2.5"/>
        <rect x="5" y="12" width="30" height="7" rx="2" fill="#fff" stroke="#15102B" stroke-width="2.5"/>
        <rect x="18" y="12" width="4" height="22" fill="#FF6B8F" stroke="#15102B" stroke-width="1.5"/>
        <path d="M20 12 q-9 -9 -10 -2 q0 3 10 2 q10 1 10 -2 q-1 -7 -10 2" fill="#FF6B8F" stroke="#15102B" stroke-width="2"/>
      </svg>
      <span class="label">Gift</span>
    </div>
    <div class="btn shop">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path d="M6 15 h28 l-3 18 h-22 z" fill="#fff" stroke="#15102B" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M13 15 q0 -9 7 -9 q7 0 7 9" fill="none" stroke="#15102B" stroke-width="3"/>
      </svg>
      <span class="label">Shop</span>
    </div>
    <div class="btn index">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path d="M6 8 q7 -2 14 2 v24 q-7 -4 -14 -2 z" fill="#fff" stroke="#15102B" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M34 8 q-7 -2 -14 2 v24 q7 -4 14 -2 z" fill="#fff" stroke="#15102B" stroke-width="2.5" stroke-linejoin="round"/>
        <ellipse cx="27" cy="19" rx="3" ry="4" fill="#B36BFF"/>
      </svg>
      <span class="label">Index</span>
    </div>
    <div class="btn pets">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <ellipse cx="20" cy="26" rx="8" ry="7" fill="#fff" stroke="#15102B" stroke-width="2.5"/>
        <circle cx="10" cy="16" r="3.5" fill="#fff" stroke="#15102B" stroke-width="2.5"/>
        <circle cx="16" cy="10" r="3.5" fill="#fff" stroke="#15102B" stroke-width="2.5"/>
        <circle cx="24" cy="10" r="3.5" fill="#fff" stroke="#15102B" stroke-width="2.5"/>
        <circle cx="30" cy="16" r="3.5" fill="#fff" stroke="#15102B" stroke-width="2.5"/>
      </svg>
      <span class="label">Pets</span>
    </div>
  </div>

  <div class="touch thumb"></div>
  <div class="touch jump"></div>

  <div class="grab">
    <div class="key">E</div>
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <ellipse cx="22" cy="15" rx="8" ry="11" fill="#fff" stroke="#15102B" stroke-width="2.5"/>
      <path d="M5 30 q4 -9 12 -6 l8 2 q4 1 3 4 l-9 0 l9 2 q3 1 1 4 l-12 0 q-8 0 -12 -6 z" fill="#FFD9B8" stroke="#15102B" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>
    <span class="label">Grab</span>
  </div>

</body>
</html>
