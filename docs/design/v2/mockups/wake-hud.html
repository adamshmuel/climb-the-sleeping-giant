<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Climb the Sleeping Giant - wake-up (V2)</title>
<!--
  V2 spec 6 (wake-up, Rules 12, 13 and 60 to 69): copied from wayup-hud.html.
  New on screen: the red edges, the "RUN HOME!" pill, the one-line wake banner and the "Dodge the red circles!" tip.
    wake-hud.html?state=face|run|dodge|bonk|garden|ladder|slam&device=desktop|phone|small
    ladder = bonked halfway up the left boot ladder with no egg (wake-bonk-ladder-*)
    slam   = a carrier on the left boot ladder with a red circle below (ladder-slam-*)
  Options used to pick the values (the chosen ones are the defaults):
    edges=weak|strong|none     red edge strength at the top of the pulse (default strong)
    run=right|under            where "RUN HOME!" sits (default right)
    bg=<name>                  another background, for example wake-face-g1
    name=<display name>        the name in the wake banner (default Adam)
  desktop = 1280x720, phone = 844x390 (iPhone 14, landscape, 47 px safe edge each side),
  small = 667x375 (4.7-inch iPhone SE, landscape, no safe edge).
  Backgrounds are real Studio shots (view-*.png). Phone shots use a wider camera, so the cover crop
  shows what a phone sees at Roblox's normal field of view.
-->
<style>
@font-face { font-family: "Fredoka One"; src: url("file:///Applications/RobloxStudio.app/Contents/Resources/content/fonts/FredokaOne-Regular.ttf"); }
@font-face { font-family: "RbxEmoji"; src: url("file:///Applications/RobloxStudio.app/Contents/Resources/content/fonts/TwemojiMozilla.ttf"); }
:root {
  --ink: #2B2340; --cream: #FFF6E4; --gold: #FFC93C; --sky: #3FA9FF; --sky-d: #1F78D1;
  --leaf: #5BD45B; --leaf-d: #2E9E3A; --sleep: #4A5BC4; --sleep-d: #2F3B8F;
  --warn: #FF8A3D; --warn-d: #D8651A; --wake: #FF3B4E; --wake-d: #C4142A;
  --s: 1;
  --edge-a: .35;   /* how solid the red is right at the screen edge (weak test value; strong is the default, set below) */
  --edge-d: 9vh;   /* how deep the red reaches in */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { font-family: "Fredoka One", sans-serif; color: #fff; }
.e { font-family: "RbxEmoji", sans-serif; font-style: normal; }
#screen { position: relative; width: 100vw; height: 100vh; background-size: cover; background-position: center; }
.stroke { -webkit-text-stroke: calc(5px * var(--s)) var(--ink); paint-order: stroke fill; }
#rbx { position: absolute; left: calc(12px * var(--s)); top: calc(10px * var(--s)); display: flex; gap: calc(8px * var(--s)); }
#rbx div { width: calc(40px * var(--s)); height: calc(40px * var(--s)); border-radius: calc(10px * var(--s)); background: rgba(20, 20, 30, .55); }

/* red edges (Rule 68): four bands, each fading from red at the screen edge to clear. Drawn under every button.
   On phones the sides stop above the thumbstick and Jump button, and the bottom band runs only between them. */
#edges { position: absolute; inset: 0; pointer-events: none; }
#edges div { position: absolute; }
.eT { left: 0; right: 0; top: 0; height: var(--edge-d); background: linear-gradient(to bottom, rgba(255, 59, 78, var(--edge-a)), rgba(255, 59, 78, 0)); }
.eB { left: 0; right: 0; bottom: 0; height: var(--edge-d); background: linear-gradient(to top, rgba(255, 59, 78, var(--edge-a)), rgba(255, 59, 78, 0)); }
.eL { left: 0; top: 0; bottom: 0; width: var(--edge-d); background: linear-gradient(to right, rgba(255, 59, 78, var(--edge-a)), rgba(255, 59, 78, 0)); }
.eR { right: 0; top: 0; bottom: 0; width: var(--edge-d); background: linear-gradient(to left, rgba(255, 59, 78, var(--edge-a)), rgba(255, 59, 78, 0)); }
body.touch .eL, body.touch .eR { bottom: 45%; -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent); }
body.touch .eB { left: 28%; right: 28%; -webkit-mask-image: linear-gradient(to right, transparent, #000 25%, #000 75%, transparent); }

/* sleep meter, top centre */
#sleep { position: absolute; left: 50%; transform: translateX(-50%); top: calc(12px * var(--s)); display: flex; flex-direction: column; align-items: center; gap: calc(6px * var(--s)); }
.meter { position: relative; width: calc(400px * var(--s)); height: calc(62px * var(--s)); border-radius: 999px; background: #FFE3E6;
  border: calc(4px * var(--s)) solid var(--ink); box-shadow: 0 calc(5px * var(--s)) 0 var(--ink); display: flex; align-items: center; padding: 0 calc(10px * var(--s)); gap: calc(10px * var(--s)); }
.meter .face { font-size: calc(38px * var(--s)); }
.meter .col { flex: 1; display: flex; flex-direction: column; gap: calc(3px * var(--s)); }
.meter .lbl { font-size: calc(17px * var(--s)); color: var(--wake-d); line-height: 1; }
.bar { position: relative; height: calc(20px * var(--s)); border-radius: 999px; background: #2F2A4A; border: calc(3px * var(--s)) solid var(--ink); overflow: hidden; }
/* while he is awake the bar is full and solid wake red, as in the real V1 game (Theme "Red") */
.fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 999px; background: var(--wake); }
.tick { position: absolute; top: -2px; bottom: -2px; width: calc(3px * var(--s)); background: rgba(255,255,255,.8); }

/* "RUN HOME!" (Rule 67): a big red pill at the top, for a carrier outside their own garden */
#runhome { position: absolute; display: flex; align-items: center; gap: calc(8px * var(--s)); white-space: nowrap;
  padding: calc(6px * var(--s)) calc(22px * var(--s)) calc(6px * var(--s)) calc(14px * var(--s)); border-radius: 999px;
  background: linear-gradient(#FF7A86, var(--wake) 55%, var(--wake-d)); border: calc(4px * var(--s)) solid var(--ink);
  box-shadow: 0 calc(5px * var(--s)) 0 var(--ink); font-size: calc(34px * var(--s)); transform: rotate(-2deg); }
#runhome .e { font-size: 1.05em; }

/* Tiptoe, right side */
#actions { position: absolute; right: calc(18px * var(--s)); top: 40%; }
.btn { position: relative; width: calc(92px * var(--s)); height: calc(92px * var(--s)); border-radius: 50%;
  border: calc(4px * var(--s)) solid var(--ink); box-shadow: 0 calc(6px * var(--s)) 0 var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(#8F9CF0, var(--sleep) 55%, var(--sleep-d)); }
.btn::after { content: ""; position: absolute; left: 14%; right: 14%; top: 8%; height: 20%; border-radius: 999px; background: rgba(255,255,255,.35); }
.btn .e { font-size: calc(36px * var(--s)); line-height: 1; }
.btn .t { font-size: calc(17px * var(--s)); }
.key { font-size: calc(13px * var(--s)); padding: 0 calc(6px * var(--s)); border-radius: calc(5px * var(--s)); background: var(--ink); margin-top: calc(2px * var(--s)); }

/* bottom pill: the carry pill, or the tip for a player with no egg */
.pill { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(18px * var(--s)); display: flex; align-items: center; gap: calc(10px * var(--s));
  padding: calc(6px * var(--s)) calc(18px * var(--s)) calc(6px * var(--s)) calc(8px * var(--s)); border-radius: 999px; background: rgba(43, 35, 64, .85);
  border: calc(4px * var(--s)) solid var(--ink); font-size: calc(22px * var(--s)); white-space: nowrap; }
.pill .egg { width: calc(40px * var(--s)); height: calc(50px * var(--s)); border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%; border: calc(3px * var(--s)) solid var(--ink);
  background: radial-gradient(circle at 35% 30%, #CDEBFF, #3FA9FF 60%, #1F78D1); }
/* the tip's icon: a small red slam circle with its gold rim, like the one on the ground */
.pill .ring { width: calc(40px * var(--s)); height: calc(40px * var(--s)); border-radius: 50%; background: #E0233A; border: calc(5px * var(--s)) solid var(--gold);
  box-shadow: 0 0 0 calc(3px * var(--s)) var(--ink); }

/* wake banner (Rule 12): one line, low and right of centre, 3 seconds */
#woke { position: absolute; transform: rotate(-2deg); padding: calc(8px * var(--s)) calc(24px * var(--s)); border-radius: calc(18px * var(--s));
  border: calc(5px * var(--s)) solid var(--ink); box-shadow: 0 calc(7px * var(--s)) 0 var(--ink); font-size: 34px; white-space: nowrap;
  background: linear-gradient(#FF7A86, var(--wake) 55%, var(--wake-d)); }
.hide { display: none !important; }
/* Roblox's own phone thumbstick and Jump button (drawn, as in the real phone screen) */
.touchc { position: absolute; border-radius: 50%; display: none; }
body.touch .touchc { display: block; }
#stick { left: 46px; bottom: 26px; width: 104px; height: 104px; background: rgba(30, 30, 40, .35); border: 3px solid rgba(255,255,255,.35); }
#stick::after { content: ""; position: absolute; left: 30px; top: 30px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.55); }
#jump { right: 46px; bottom: 30px; width: 80px; height: 80px; background: rgba(30, 30, 40, .35); border: 3px solid rgba(255,255,255,.35); color: rgba(255,255,255,.8); font-size: 34px; text-align: center; line-height: 74px; }
/* phone sizes from the core heist spec: text never below 14 px */
body.touch .meter { width: 260px; height: 46px; padding: 0 8px; gap: 6px; }
body.touch .meter .face { font-size: 26px; }
body.touch .meter .lbl { font-size: 14px; }
body.touch .bar { height: 13px; }
body.touch .btn { width: 60px; height: 60px; }
body.touch .btn .e { font-size: 22px; }
body.touch .btn .t { font-size: 14px; -webkit-text-stroke: 3.5px var(--ink); }
body.touch .pill { font-size: 14px; }
body.touch .pill .egg { width: 24px; height: 30px; }
body.touch .pill .ring { width: 24px; height: 24px; border-width: 3px; box-shadow: 0 0 0 2px var(--ink); }
body.touch #woke { font-size: 14px; padding: 4px 12px; border-width: 3px; box-shadow: 0 4px 0 var(--ink); -webkit-text-stroke: 3px var(--ink); }
body.touch #runhome { font-size: 20px; padding: 3px 14px 3px 9px; border-width: 3px; box-shadow: 0 3px 0 var(--ink); -webkit-text-stroke: 3.5px var(--ink); }
</style>
</head>
<body>
<div id="screen">
  <div id="edges"><div class="eT"></div><div class="eB"></div><div class="eL"></div><div class="eR"></div></div>
  <div id="rbx"><div></div><div></div><div></div></div>
  <div id="sleep">
    <div class="meter" id="meter">
      <span class="face e">😠</span>
      <div class="col">
        <span class="lbl" id="mlabel">AWAKE! Back to sleep in 0:15</span>
        <div class="bar"><div class="fill"></div><div class="tick" style="left:60%"></div><div class="tick" style="left:85%"></div></div>
      </div>
    </div>
  </div>
  <div id="runhome" class="stroke hide"><span class="e">🏃</span>RUN HOME!</div>
  <div id="actions"><div class="btn" id="tiptoe"><span class="e">🦶</span><span class="t stroke">Tiptoe</span><span class="key" id="tkey">C</span></div></div>
  <div class="pill hide" id="carry"><div class="egg"></div><span class="stroke">Dodge the red circles!</span></div>
  <div class="pill hide" id="tip"><div class="ring"></div><span class="stroke">Dodge the red circles!</span></div>
  <div id="woke" class="stroke hide"><span class="e">💥</span> <span id="who">Adam</span> woke the Giant!</div>
  <div class="touchc" id="stick"></div>
  <div class="touchc" id="jump">&#x2B06;</div>
</div>
<script>
const q = new URLSearchParams(location.search);
const state = q.get("state") || "face";
const device = q.get("device") || "desktop";
const touch = device !== "desktop";
const $ = id => document.getElementById(id);
const bg = { face: "wake-face", run: "wake-run", dodge: "wake-dodge", bonk: "wake-bonk", garden: "wake-garden", land: "wake-face", ladder: "wake-bonk-ladder", slam: "ladder-slam" };
const shot = q.get("bg") || bg[state];
$("screen").style.backgroundImage = "url(" + (touch ? "view-phone-" : "view-") + shot + ".png)";
// on phones a display name longer than 12 letters is cut to 11 and "…", so the banner stays short on a small phone
let who = q.get("name") || "Adam";
if (device !== "desktop" && [...who].length > 12) who = [...who].slice(0, 11).join("") + "…";
$("who").textContent = who;

// red edges: weak = 35% solid at the edge, 9% of the screen height deep; strong = 55% and 14%
const edges = q.get("edges") || "strong";
if (edges === "strong") { document.documentElement.style.setProperty("--edge-a", ".55"); document.documentElement.style.setProperty("--edge-d", "14vh"); }
// inside a garden the edges have faded out (Rule 68)
if (edges === "none" || state === "garden") $("edges").classList.add("hide");

// the safe edge: iPhone 14 keeps 47 px free at each side; the 4.7-inch phone has none
const safe = device === "phone" ? 47 : 0;
if (touch) {
  document.body.classList.add("touch");
  document.documentElement.style.setProperty("--s", "0.62");
  $("rbx").style.left = (safe + 6) + "px";
  $("sleep").style.top = "8px";
  $("actions").style.right = (safe + 13) + "px"; $("actions").style.top = ""; $("actions").style.bottom = "128px";
  $("tkey").classList.add("hide");
  $("stick").style.left = (safe - 1) + "px"; $("jump").style.right = (safe - 1) + "px";
}

// RUN HOME: right of the meter (default) or under it
const place = q.get("run") || "right";
const rh = $("runhome");
const W = window.innerWidth;
if (place === "under") {
  rh.style.left = "50%"; rh.style.transform = "translateX(-50%) rotate(-2deg)";
  rh.style.top = touch ? "62px" : "90px";
} else {
  // its left edge 14 px (phone 10 px) right of the meter's right edge, level with the meter
  const meterRight = W / 2 + (touch ? 130 : 200);
  rh.style.left = (meterRight + (touch ? 10 : 14)) + "px";
  rh.style.top = touch ? "12px" : "14px";
}

// banner: low and right of centre (V1). On phones its RIGHT edge is pinned 12 px left of the Tiptoe/Jump column,
// so a long name grows to the left instead of running under the Jump button.
const woke = $("woke");
if (touch) { woke.style.right = (safe + 46 + 80 + 12) + "px"; woke.style.bottom = "100px"; }
else { woke.style.left = "66%"; woke.style.transform = "translateX(-50%) rotate(-2deg)"; woke.style.bottom = "100px"; }

const meter = (label) => { $("mlabel").textContent = label; };
// 0-2 s: his face wakes; the banner shows for 3 s. The player here has no egg, so the bottom tip shows too.
if (state === "face") { meter("AWAKE! Back to sleep in 0:15"); woke.classList.remove("hide"); $("tip").classList.remove("hide"); }
// a carrier running home with a Rare egg, a red circle under them
if (state === "run") { meter("AWAKE! Back to sleep in 0:11"); rh.classList.remove("hide"); $("carry").classList.remove("hide"); }
// no egg, a red circle beside them, the fist coming down
if (state === "dodge") { meter("AWAKE! Back to sleep in 0:08"); $("tip").classList.remove("hide"); }
// bonked: tumbled over with the star puff. Nothing new on screen (no card, no text).
if (state === "bonk") { meter("AWAKE! Back to sleep in 0:07"); $("tip").classList.remove("hide"); }
// inside their own garden: no edges, no pill, no tip
if (state === "garden") { meter("AWAKE! Back to sleep in 0:06"); }
// bonked on a ladder with no egg: they hold on with the star ring. Nothing new on screen; the tip stays.
if (state === "ladder") { meter("AWAKE! Back to sleep in 0:09"); $("tip").classList.remove("hide"); }
// a carrier climbing down the left boot ladder with an Uncommon egg, a red circle below (no ladder glow: dropped 2026-11-04)
if (state === "slam") {
  meter("AWAKE! Back to sleep in 0:12"); rh.classList.remove("hide"); $("carry").classList.remove("hide");
  document.querySelector("#carry .egg").style.background = "radial-gradient(circle at 35% 30%, #DFFFD8, #5BD45B 60%, #2E9E3A)";
}
// a carrier who has just landed from the bounce, still facing him: used to test where RUN HOME sits
if (state === "land") { meter("AWAKE! Back to sleep in 0:13"); rh.classList.remove("hide"); $("carry").classList.remove("hide"); }
</script>
</body>
</html>
