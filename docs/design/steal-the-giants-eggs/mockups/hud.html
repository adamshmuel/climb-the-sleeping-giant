<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Steal the Giant's Eggs - screen layout mockup</title>
<!--
  Screen layout mockup. Open with a query string:
    hud.html?state=spawn|belly|wakeup|base|deepsleep&device=desktop|phone
  desktop = 1280x720, phone = 844x390 (iPhone 14, landscape).
  The background is a real Play screenshot from Studio (view-*.png).
  Fonts are Roblox's own font files from the Studio install, so the text
  looks the same as it will in the game (Fredoka One + Roblox emoji).
-->
<style>
@font-face { font-family: "Fredoka One"; src: url("file:///Applications/RobloxStudio.app/Contents/Resources/content/fonts/FredokaOne-Regular.ttf"); }
@font-face { font-family: "RbxEmoji"; src: url("file:///Applications/RobloxStudio.app/Contents/Resources/content/fonts/TwemojiMozilla.ttf"); }
:root {
  --ink: #2B2340;        /* outlines and text stroke */
  --cream: #FFF6E4;      /* panel fill */
  --gold: #FFC93C;       /* cash, Legendary, Shop */
  --gold-d: #E09A12;
  --sky: #3FA9FF;        /* Index, Rare */
  --sky-d: #1F78D1;
  --leaf: #5BD45B;       /* Upgrades, Uncommon, "safe" */
  --leaf-d: #2E9E3A;
  --pink: #FF6EC7;       /* Pets, Dream Egg */
  --pink-d: #D9409E;
  --sleep: #4A5BC4;      /* sleep meter, Zzz */
  --sleep-d: #2F3B8F;
  --wake: #FF3B4E;       /* giant awake, danger */
  --wake-d: #C4142A;
  --epic: #B05CFF;
  --s: 1;                /* size scale: 1 on desktop, 0.72 on phone */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { font-family: "Fredoka One", sans-serif; color: #fff; }
.e { font-family: "RbxEmoji", sans-serif; font-style: normal; }
#screen { position: relative; width: 100vw; height: 100vh; background-size: cover; background-position: center; }

/* text outline used everywhere (Roblox UIStroke) */
.stroke { -webkit-text-stroke: calc(5px * var(--s)) var(--ink); paint-order: stroke fill; }

/* Roblox's own top bar buttons (reserved, not ours) */
#rbx { position: absolute; left: calc(12px * var(--s)); top: calc(10px * var(--s)); display: flex; gap: calc(8px * var(--s)); }
#rbx div { width: calc(40px * var(--s)); height: calc(40px * var(--s)); border-radius: calc(10px * var(--s)); background: rgba(20, 20, 30, .55); }

/* chunky button */
.btn { position: relative; width: calc(78px * var(--s)); height: calc(78px * var(--s)); border-radius: calc(20px * var(--s));
  border: calc(4px * var(--s)) solid var(--ink); box-shadow: 0 calc(6px * var(--s)) 0 var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; }
.btn::after { content: ""; position: absolute; left: 10%; right: 10%; top: 7%; height: 22%; border-radius: 999px; background: rgba(255,255,255,.35); }
.btn .e { font-size: calc(36px * var(--s)); line-height: 1; margin-top: calc(-4px * var(--s)); }
.btn .t { font-size: calc(17px * var(--s)); line-height: 1.05; margin-top: calc(2px * var(--s)); }
.b-gold { background: linear-gradient(#FFE07A, var(--gold) 55%, var(--gold-d)); }
.b-sky  { background: linear-gradient(#8ED0FF, var(--sky) 55%, var(--sky-d)); }
.b-leaf { background: linear-gradient(#A6F29A, var(--leaf) 55%, var(--leaf-d)); }
.b-pink { background: linear-gradient(#FFB3E3, var(--pink) 55%, var(--pink-d)); }
.b-sleep{ background: linear-gradient(#8F9CF0, var(--sleep) 55%, var(--sleep-d)); }
.b-epic { background: linear-gradient(#D7A8FF, var(--epic) 55%, #7E2FD0); }
.b-orange { background: linear-gradient(#FFD08F, #FF9A3C 55%, #D8651A); }
.badge { position: absolute; right: calc(-8px * var(--s)); top: calc(-8px * var(--s)); min-width: calc(26px * var(--s)); height: calc(26px * var(--s));
  border-radius: 999px; background: var(--wake); border: calc(3px * var(--s)) solid var(--ink); font-size: calc(14px * var(--s));
  display: flex; align-items: center; justify-content: center; padding: 0 calc(5px * var(--s)); z-index: 2; }

/* left menu: 2 columns x 3 rows on computers, 3 columns x 2 rows on phones, middle-left, above the thumbstick area */
#menu { position: absolute; left: calc(16px * var(--s)); top: 30%; display: grid; grid-template-columns: repeat(2, auto); gap: calc(14px * var(--s)); }

/* cash, top right */
#cash { position: absolute; right: calc(16px * var(--s)); top: calc(14px * var(--s)); display: flex; flex-direction: column; align-items: flex-end; gap: calc(6px * var(--s)); }
.pill { display: flex; align-items: center; gap: calc(8px * var(--s)); height: calc(54px * var(--s)); padding: 0 calc(18px * var(--s)) 0 calc(8px * var(--s));
  border-radius: 999px; background: linear-gradient(#5D4E8C, #3A2F63); border: calc(4px * var(--s)) solid var(--ink); box-shadow: 0 calc(5px * var(--s)) 0 var(--ink); }
.pill .e { font-size: calc(34px * var(--s)); }
.pill .n { font-size: calc(32px * var(--s)); color: #FFE27A; }
.chip { font-size: calc(17px * var(--s)); padding: calc(4px * var(--s)) calc(12px * var(--s)); border-radius: 999px; background: rgba(43, 35, 64, .75); border: calc(3px * var(--s)) solid var(--ink); }
.chip.green { color: #9BFF8A; }
.chip.gold { color: #FFE27A; }

/* sleep meter, top centre (below Roblox's top bar row on phone) */
#sleep { position: absolute; left: 50%; transform: translateX(-50%); top: calc(12px * var(--s)); display: flex; flex-direction: column; align-items: center; gap: calc(6px * var(--s)); }
.meter { position: relative; width: calc(400px * var(--s)); height: calc(62px * var(--s)); border-radius: 999px; background: var(--cream);
  border: calc(4px * var(--s)) solid var(--ink); box-shadow: 0 calc(5px * var(--s)) 0 var(--ink); display: flex; align-items: center; padding: 0 calc(10px * var(--s)); gap: calc(10px * var(--s)); }
.meter .face { font-size: calc(38px * var(--s)); }
.meter .col { flex: 1; display: flex; flex-direction: column; gap: calc(3px * var(--s)); }
.meter .lbl { font-size: calc(17px * var(--s)); color: var(--sleep-d); line-height: 1; }
.bar { position: relative; height: calc(20px * var(--s)); border-radius: 999px; background: #2F2A4A; border: calc(3px * var(--s)) solid var(--ink); overflow: hidden; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(90deg, #6EE07A, #FFE066 60%, #FF8A3D 85%, #FF3B4E); background-size: calc(400px * var(--s)) 100%; }
.tick { position: absolute; top: -2px; bottom: -2px; width: calc(3px * var(--s)); background: rgba(255,255,255,.8); }
.deep { font-size: calc(18px * var(--s)); padding: calc(4px * var(--s)) calc(14px * var(--s)); border-radius: 999px; background: linear-gradient(#5B4BB5, #33287A); border: calc(3px * var(--s)) solid var(--ink); }

/* hint and banners */
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(22px * var(--s)); font-size: calc(24px * var(--s)); white-space: nowrap;
  padding: calc(8px * var(--s)) calc(20px * var(--s)); border-radius: 999px; background: rgba(43, 35, 64, .82); border: calc(4px * var(--s)) solid var(--ink); }
.hint:empty { display: none; }
.banner { position: absolute; left: 50%; transform: translateX(-50%) rotate(-2deg); padding: calc(10px * var(--s)) calc(28px * var(--s)); border-radius: calc(18px * var(--s));
  border: calc(5px * var(--s)) solid var(--ink); box-shadow: 0 calc(7px * var(--s)) 0 var(--ink); font-size: calc(38px * var(--s)); white-space: nowrap; }
.banner.red { background: linear-gradient(#FF7A86, var(--wake) 55%, var(--wake-d)); }
.banner.gold { background: linear-gradient(#FFE58F, var(--gold) 55%, var(--gold-d)); }
.banner small { display: block; font-size: .5em; text-align: center; margin-top: calc(2px * var(--s)); }

/* carry status, bottom centre (between the two thumb zones) */
#carry { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(18px * var(--s)); display: flex; align-items: center; gap: calc(10px * var(--s));
  padding: calc(6px * var(--s)) calc(18px * var(--s)) calc(6px * var(--s)) calc(8px * var(--s)); border-radius: 999px; background: rgba(43, 35, 64, .82); border: calc(4px * var(--s)) solid var(--ink); font-size: calc(22px * var(--s)); white-space: nowrap; }
#carry .egg { width: calc(40px * var(--s)); height: calc(50px * var(--s)); border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%; border: calc(3px * var(--s)) solid var(--ink); }

/* right side action buttons */
#actions { position: absolute; right: calc(18px * var(--s)); display: flex; flex-direction: column; align-items: center; gap: calc(14px * var(--s)); }
.round { width: calc(92px * var(--s)); height: calc(92px * var(--s)); border-radius: 50%; }
.round .t { font-size: calc(17px * var(--s)); }
.key { font-size: calc(13px * var(--s)); padding: 0 calc(6px * var(--s)); border-radius: calc(5px * var(--s)); background: var(--ink); color: #fff; margin-top: calc(2px * var(--s)); }
.on { outline: calc(5px * var(--s)) solid #FFF; outline-offset: calc(2px * var(--s)); }

/* world-style prompt (a ProximityPrompt in the game) */
.prompt { position: absolute; display: flex; align-items: center; gap: calc(8px * var(--s)); padding: calc(6px * var(--s)) calc(14px * var(--s)) calc(6px * var(--s)) calc(6px * var(--s));
  border-radius: calc(14px * var(--s)); background: rgba(43, 35, 64, .85); border: calc(3px * var(--s)) solid #fff; font-size: calc(20px * var(--s)); }
.prompt .k { width: calc(38px * var(--s)); height: calc(38px * var(--s)); border-radius: 50%; background: #fff; color: var(--ink); display: flex; align-items: center; justify-content: center; font-size: calc(20px * var(--s)); }

/* toast for hatching */
.toast { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: calc(12px * var(--s)); padding: calc(8px * var(--s)) calc(22px * var(--s)) calc(8px * var(--s)) calc(10px * var(--s));
  border-radius: calc(20px * var(--s)); background: var(--cream); color: var(--ink); border: calc(4px * var(--s)) solid var(--ink); box-shadow: 0 calc(6px * var(--s)) 0 var(--ink); font-size: calc(22px * var(--s)); white-space: nowrap; }
.toast .e { font-size: calc(42px * var(--s)); }
.toast b { color: var(--sky-d); }
.coins { position: absolute; font-size: calc(26px * var(--s)); }

.hide { display: none !important; }
</style>
</head>
<body>
<div id="screen">
  <div id="rbx"><div></div><div></div><div></div></div>

  <!-- top centre: shared sleep meter + Deep Sleep countdown -->
  <div id="sleep">
    <div class="meter" id="meter">
      <span class="face e" id="face">😴</span>
      <div class="col">
        <span class="lbl" id="mlabel">Giant is sleeping</span>
        <div class="bar"><div class="fill" id="fill" style="width:24%"></div><div class="tick" style="left:60%"></div><div class="tick" style="left:85%"></div></div>
      </div>
    </div>
    <div class="deep stroke" id="deep"><span class="e">🌙</span> Deep Sleep in 4:12</div>
  </div>

  <!-- top right: cash -->
  <div id="cash">
    <div class="pill"><span class="e">💰</span><span class="n stroke" id="cashn">$1,240</span></div>
    <div class="chip green stroke" id="income">+$12/s</div>
    <div class="chip gold stroke" id="boost"><span class="e">👥</span> Friend Boost +10%</div>
  </div>

  <!-- middle left: menu -->
  <div id="menu">
    <div class="btn b-gold"><span class="e">🛒</span><span class="t stroke">Shop</span></div>
    <div class="btn b-sky"><span class="badge stroke">3</span><span class="e">📖</span><span class="t stroke">Index</span></div>
    <div class="btn b-leaf"><span class="e">👟</span><span class="t stroke">Upgrade</span></div>
    <div class="btn b-pink"><span class="e">🐾</span><span class="t stroke">Pets</span></div>
    <div class="btn b-epic"><span class="badge stroke" style="background:#5BD45B">+<i class="e">🥚</i></span><span class="e">💌</span><span class="t stroke">Invite</span></div>
    <div class="btn b-orange"><span class="badge stroke">!</span><span class="e">🎁</span><span class="t stroke">Daily</span></div>
  </div>

  <!-- right: actions -->
  <div id="actions">
    <div class="btn b-sleep" id="lullaby" style="width:calc(74px*var(--s));height:calc(74px*var(--s))"><span class="e" style="font-size:calc(32px*var(--s))">🎵</span><span class="t stroke" style="font-size:calc(14px*var(--s))">Lullaby</span></div>
    <div class="btn b-sleep round" id="tiptoe"><span class="e">🦶</span><span class="t stroke">Tiptoe</span><span class="key" id="tkey">C</span></div>
  </div>

  <div class="hint stroke" id="hint"></div>
  <div class="banner red stroke hide" id="woke"><span class="e">💥</span> Leo woke the Giant! <small>Run home with your egg!</small></div>
  <div class="prompt hide" id="grab"><span class="k">E</span><span>Hold to <b style="color:#FFE27A">Grab</b></span></div>
  <div id="carry" class="hide"><div class="egg" id="cegg"></div><span class="stroke" id="ctext"></span><span class="e">🏡</span></div>
  <div class="toast hide" id="toast"><span class="e">🐉</span><span>Hatched! <b>Sock Dragon</b> · Rare · <span style="color:#2E9E3A">BIG</span></span></div>
</div>

<script>
const q = new URLSearchParams(location.search);
const state = q.get("state") || "spawn";
const device = q.get("device") || "desktop";
const phone = device === "phone";
const $ = id => document.getElementById(id);
const root = document.documentElement;

// background: real Play screenshots
const bg = { spawn: "view-spawn.png", belly: "view-belly.png", wakeup: "view-wakeup.png", base: "view-base.png", deepsleep: "view-deepsleep.png" };
const bgPhone = { spawn: "view-phone-spawn.png", belly: "view-phone-belly.png", wakeup: "view-phone-wakeup.png", base: "view-phone-base.png", deepsleep: "view-phone-deepsleep.png" };
$("screen").style.backgroundImage = `url(${(phone ? bgPhone : bg)[state]})`;

if (phone) {
  root.style.setProperty("--s", "0.62");
  // phone safe area: 47px notch sides; Roblox top bar row is 58px tall
  $("rbx").style.left = "53px";
  $("menu").style.left = "53px"; $("menu").style.top = "86px";
  $("menu").style.gridTemplateColumns = "repeat(3, auto)";
  $("cash").style.right = "53px";
  $("sleep").style.top = "8px";
  $("actions").style.right = "60px"; $("actions").style.bottom = "128px";
  $("tkey").classList.add("hide");
  // on phones the Lullaby button only appears while the meter is at 85% or more, or he is awake (see the wakeup state)
  $("lullaby").classList.add("hide");
  $("boost").classList.add("hide");       // shown inside the cash panel on tap
} else {
  $("actions").style.top = "38%";
}

const hint = $("hint");
hint.style.fontSize = phone ? "15px" : "24px";

if (state === "spawn") {
  hint.innerHTML = '<span class="e">👣</span> Follow the glowing footprints!';
  $("grab").classList.add("hide");
}
if (state === "belly") {
  $("fill").style.width = "64%";
  $("mlabel").textContent = "He's stirring... tiptoe!";
  $("face").textContent = "😪";
  $("tiptoe").classList.add("on");
  // world prompt next to the Rare egg (a ProximityPrompt in the game)
  const g = $("grab"); g.classList.remove("hide");
  g.style.left = phone ? "66%" : "58%"; g.style.top = phone ? "318px" : "560px";
  if (phone) g.innerHTML = '<span class="k" style="width:26px;height:26px;font-size:15px">👆</span><span>Hold to <b style="color:#FFE27A">Grab</b></span>';
  g.style.fontSize = phone ? "13px" : "20px";
  hint.innerHTML = "";
}
if (state === "wakeup") {
  $("fill").style.width = "100%";
  $("meter").style.background = "#FFE3E6";
  $("mlabel").textContent = "AWAKE! Back to sleep in 0:15";
  $("mlabel").style.color = "#C4142A";
  $("face").textContent = "😠";
  $("deep").classList.add("hide");
  $("woke").classList.remove("hide");
  if (phone) {
    // phone: small, at the top under the meter (where the Deep Sleep line sits), clear of the giant, the slam circle and the runners
    $("woke").style.top = "50px"; $("woke").style.fontSize = "14px"; $("woke").style.padding = "4px 12px";
    $("woke").querySelector("small").classList.add("hide");
    $("lullaby").classList.remove("hide");   // shown only now: meter full / he is awake
  } else {
    $("woke").style.bottom = "100px"; $("woke").style.left = "66%";  // low and right: keeps the giant and the red slam circles visible
    $("woke").style.fontSize = "34px";
  }
  $("carry").classList.remove("hide");
  $("cegg").style.background = "radial-gradient(circle at 35% 30%, #FFFFFF, #EDE6D6 60%, #BFB49C)";
  $("ctext").innerHTML = 'Dodge the red circles!';
  hint.innerHTML = "";
}
if (state === "deepsleep") {
  $("fill").style.width = "12%";
  $("meter").style.background = "#EFE6FF";
  $("mlabel").textContent = "DEEP SLEEP! Noise counts half";
  $("mlabel").style.color = "#6A3FC4";
  $("face").textContent = "😴";
  $("deep").innerHTML = '<span class="e">🌙</span> Dream Egg on his nose! 0:48';
  $("deep").style.background = "linear-gradient(#FF9BD8, #FF6EC7 55%, #D9409E)";
  hint.innerHTML = '<span class="e">🥚</span> Race to his nose!';
}
if (state === "base") {
  $("cashn").textContent = "$18,920";
  $("income").textContent = "+$96/s";
  $("toast").classList.remove("hide");
  $("toast").style.top = phone ? "78px" : "128px";
  $("toast").style.fontSize = phone ? "14px" : "22px";
  hint.innerHTML = "";
  const c = document.createElement("div"); c.className = "coins stroke";
  c.innerHTML = '<span class="e">🪙</span> +$1,520'; c.style.color = "#FFE27A";
  c.style.right = phone ? "70px" : "40px"; c.style.top = phone ? "88px" : "150px"; c.style.fontSize = phone ? "16px" : "26px";
  document.getElementById("screen").appendChild(c);
}
</script>
</body>
</html>
